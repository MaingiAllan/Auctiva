spring:
  application:
    name: auctiva-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auctiva
    username: auctiva
    password: auctiva
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:disabled}
            redirect-uri: ${AUCTIVA_OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
            scope: openid,email,profile
          apple:
            provider: apple
            client-id: ${APPLE_OAUTH_CLIENT_ID:disabled}
            client-secret: ${APPLE_OAUTH_CLIENT_SECRET:disabled}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${AUCTIVA_OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
            scope: openid,email
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 41MB

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auctiva-backend

server:
  port: 8080

auctiva:
  image-storage-dir: ${AUCTIVA_IMAGE_STORAGE_DIR:./uploads}
  frontend-url: ${AUCTIVA_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:}
  turnstile:
    secret-key: ${AUCTIVA_TURNSTILE_SECRET_KEY:}
  jwt:
    # Override with a real secret via env var in every environment beyond local dev.
    secret: ${AUCTIVA_JWT_SECRET:dev-only-secret-change-me-please-this-is-long-enough-for-hs256}
    expiration-minutes: 60
  mpesa:
    # Sandbox by default. Live: MPESA_BASE_URL=https://api.safaricom.co.ke plus your live credentials.
    base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:174379}
    passkey: ${MPESA_PASSKEY:}
    callback-base-url: ${MPESA_CALLBACK_BASE_URL:}
    callback-token: ${MPESA_CALLBACK_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
