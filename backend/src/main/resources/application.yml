spring:
  application:
    name: auctiva-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auctiva
    username: auctiva
    password: auctiva
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auctiva-backend

server:
  port: 8080

auctiva:
  jwt:
    # Override with a real secret via env var in every environment beyond local dev.
    secret: ${AUCTIVA_JWT_SECRET:dev-only-secret-change-me-please-this-is-long-enough-for-hs256}
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
